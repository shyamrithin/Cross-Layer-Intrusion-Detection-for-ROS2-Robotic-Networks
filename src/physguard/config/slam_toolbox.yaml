# =============================================================================
# File        : slam_toolbox.yaml
# Package     : physguard
# Project     : Cross-Layer Intrusion Detection for ROS 2 Robotic Networks
# Author      : Shyam Rithin S (RA2311004010308)
# Description : Online-async SLAM (slam_toolbox) parameters for the arena. The
#               robot laps the oval under pure pursuit while the lidar maps the
#               perimeter walls and obstacles, so a map builds with no teleop.
#               Frames follow the sim: map -> odom (from SLAM) -> base_link
#               (from the gz diff-drive plugin).
# =============================================================================
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # frames / topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # map
    resolution: 0.05
    max_laser_range: 12.0
    map_update_interval: 1.0
    transform_publish_period: 0.02
    resolution_publish_period: 0.5

    # when to add a new scan to the graph
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    minimum_time_interval: 0.3

    # scan matcher
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.12
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
