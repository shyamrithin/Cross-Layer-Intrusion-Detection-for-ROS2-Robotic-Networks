<!DOCTYPE html>
<!--
================================================================================
 File        : index.html
 Project     : Cross-Layer Intrusion Detection for ROS 2 Robotic Networks
 Author      : Shyam Rithin S
 Description : Operator console for ids_console.py. Instrument-style layout for
               a robotics network-security bench: a dense command catalogue on
               the left, and a cross-layer detector readout (independent NET /
               PHYS indicators + fused verdict), running processes and output
               log on the right. Two accent hues only, each tied to one
               detector layer. Polls /api/state; no libraries, no build step.
               The JS API contract matches the previous version exactly.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cross-Layer IDS · Operator Console</title>
<style>
  :root{
    --bg:#0f1012; --panel:#161719; --panel2:#1c1e21; --raise:#232528;
    --line:#2a2d31; --line2:#3b3f45;
    --ink:#e8e5de; --mut:#9a968c; --dim:#6a675f; --faint:#4a4842;
    --net:#48b4c4; --net-bg:#0f2d33; --net-ln:#1d5660;
    --phy:#d99443; --phy-bg:#33240f; --phy-ln:#60461d;
    --alarm:#e5484d; --alarm-bg:#2e1414; --alarm-ln:#5c2525;
    --ok:#57a884; --ok-bg:#122a20;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono);
       -webkit-font-smoothing:antialiased}
  .ui{font-family:var(--sans)}
  .micro{font:10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  a,button{font-family:var(--mono)}

  /* ---- top bar ---- */
  header{display:flex;align-items:center;gap:16px;height:46px;padding:0 16px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header .mark{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.02em}
  header .mark b{color:var(--net);font-weight:600}
  header .mark i{color:var(--phy);font-style:normal}
  .env{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .env span{background:var(--panel2);padding:4px 9px;font-size:10.5px;color:var(--mut);letter-spacing:.04em}
  .sp{flex:1}
  .dry{color:var(--phy);border:1px solid var(--phy-ln);background:var(--phy-bg);
       padding:3px 9px;border-radius:3px;font-size:10.5px;letter-spacing:.08em}
  .conn{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:7px}
  .conn .led{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .conn.stale .led{background:var(--faint)}

  /* ---- command strip ---- */
  .strip{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);
         background:var(--bg);min-height:52px}
  .strip .tag{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line);
              color:var(--dim);font-size:10px;letter-spacing:.14em;white-space:nowrap}
  .strip .cmd{flex:1;display:flex;align-items:center;padding:0 14px;overflow:auto;color:var(--ink);
              font-size:13px;white-space:nowrap}
  .strip .cmd.empty{color:var(--faint)}
  .strip .launch{border:none;border-left:1px solid var(--line);background:var(--panel);
                 color:var(--dim);padding:0 20px;cursor:not-allowed;letter-spacing:.1em;font-size:11px}
  .strip .launch.armed{background:#13332a;color:#8fe3bf;cursor:pointer}
  .strip .launch.armed:hover{background:#174033}

  /* ---- body grid ---- */
  .grid{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 46px - 53px)}
  .catalog{overflow-y:auto;border-right:1px solid var(--line)}
  .rail{overflow-y:auto;background:var(--panel)}

  /* ---- catalog ---- */
  .cathead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;
           padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .cathead .nm{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;
               text-transform:uppercase;color:var(--mut)}
  .cathead .ct{font-size:10px;color:var(--faint)}
  .cathead .rule{flex:1;height:1px;background:var(--line)}

  .row{display:grid;grid-template-columns:3px 1fr auto;align-items:center;gap:0;
       border-bottom:1px solid #202225;cursor:pointer;transition:background .08s}
  .row:hover{background:#191b1e}
  .row.sel{background:#1b1e22}
  .row .bar{align-self:stretch;background:var(--faint)}
  .row.net .bar{background:var(--net)} .row.phy .bar{background:var(--phy)}
  .row.none .bar{background:var(--faint)}
  .row .mid{padding:8px 12px;min-width:0}
  .row .lab{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .row .lab .t{font-family:var(--sans);font-size:13px;color:var(--ink)}
  .row .lab .ly{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:2px}
  .ly.net{color:var(--net);background:var(--net-bg)} .ly.phy{color:var(--phy);background:var(--phy-bg)}
  .ly.none{color:var(--dim);background:#1f2124}
  .row .lab .flag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
                  border:1px solid var(--line2);padding:0 4px;border-radius:2px}
  .row .lab .flag.danger{color:var(--alarm);border-color:var(--alarm-ln)}
  .row .cmdline{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .act{padding:0 14px;color:var(--faint);font-size:16px;white-space:nowrap}
  .row:hover .act{color:var(--mut)}
  .row.live{background:var(--alarm-bg)}
  .row.live .bar{background:var(--alarm)}
  .row.live .act{color:var(--alarm)}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--alarm);display:inline-block;
         animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}

  /* ---- rail: instrument ---- */
  .panel{border-bottom:1px solid var(--line);padding:14px 16px}
  .panel .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .panel .hd .micro{color:var(--mut)}

  .bus{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);margin-bottom:14px;
       letter-spacing:.04em}
  .bus .n{color:var(--mut)} .bus .ar{color:var(--faint)}

  .cells{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .cell{border:1px solid var(--line2);border-radius:4px;padding:11px 12px;background:var(--panel2);
        transition:.15s}
  .cell .k{font:10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .cell .v{font-size:13px;letter-spacing:.08em;color:var(--faint)}
  .cell.net.on{border-color:var(--net);background:var(--net-bg)}
  .cell.net.on .k{color:var(--net)} .cell.net.on .v{color:var(--net)}
  .cell.phy.on{border-color:var(--phy);background:var(--phy-bg)}
  .cell.phy.on .k{color:var(--phy)} .cell.phy.on .v{color:var(--phy)}

  .verdict{border:1px solid var(--line2);border-radius:4px;padding:14px;text-align:center;
           background:var(--panel2)}
  .verdict .big{font-size:18px;letter-spacing:.1em;color:var(--mut)}
  .verdict .sub{font-size:10.5px;color:var(--dim);margin-top:6px}
  .verdict.clear{border-color:var(--ok);background:var(--ok-bg)} .verdict.clear .big{color:var(--ok)}
  .verdict.intr{border-color:var(--alarm);background:var(--alarm-bg)} .verdict.intr .big{color:var(--alarm)}
  .verdict.cal,.verdict.rec{border-color:var(--phy-ln)} .verdict.cal .big,.verdict.rec .big{color:var(--phy)}

  .proc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
        padding:7px 0;border-top:1px solid #202225;font-size:11px}
  .proc:first-child{border-top:none}
  .proc .age{color:var(--dim);font-size:10px}
  .proc .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proc button{background:none;border:1px solid var(--alarm-ln);color:var(--alarm);
               padding:2px 8px;border-radius:3px;font-size:10px;cursor:pointer;letter-spacing:.05em}
  .proc button:hover{background:var(--alarm-bg)}
  .empty{color:var(--faint);font-size:11px;padding:4px 0}
  .stopall{width:100%;margin-top:11px;background:var(--alarm-bg);border:1px solid var(--alarm-ln);
           color:#f0a8a8;padding:8px;border-radius:3px;cursor:pointer;letter-spacing:.1em;font-size:11px}
  .stopall:hover{background:#3a1818}

  .log{height:220px;overflow-y:auto;font-size:11px;line-height:1.6;color:var(--mut);
       background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
  .log .tm{color:var(--faint)}
  .log .s{color:var(--ok)} .log .w{color:var(--phy)} .log .e{color:var(--alarm)}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <span class="mark"><b>cross-layer</b> <i>IDS</i> · operator console</span>
  <div class="env" id="env"></div>
  <span class="sp"></span>
  <span id="dry" class="dry" style="display:none">DRY-RUN · NOTHING LAUNCHES</span>
  <span class="conn" id="conn"><span class="led"></span><span id="conntext">linked</span></span>
</header>

<div class="strip">
  <div class="tag">SELECTED COMMAND</div>
  <div class="cmd empty" id="selcmd">select an entry from the catalogue</div>
  <button class="launch" id="launch" disabled>LAUNCH</button>
</div>

<div class="grid">
  <div class="catalog" id="catalog"></div>

  <div class="rail">
    <div class="panel">
      <div class="hd"><span class="micro">cross-layer detector</span></div>
      <div class="bus">
        <span class="n">ctrl</span><span class="ar">──</span>
        <span class="n">wire</span><span class="ar">──▶</span>
        <span style="color:var(--net)">net</span><span class="ar">│</span><span style="color:var(--phy)">phys</span>
        <span class="ar">──▶</span><span class="n">fuse</span><span class="ar">──▶</span><span class="n">robot</span>
      </div>
      <div class="cells">
        <div class="cell net" id="cell-net"><div class="k">network layer</div><div class="v" id="v-net">quiet</div></div>
        <div class="cell phy" id="cell-phy"><div class="k">physics layer</div><div class="v" id="v-phy">quiet</div></div>
      </div>
      <div class="verdict clear" id="verdict">
        <div class="big" id="vbig">—</div>
        <div class="sub" id="vsub">waiting for detector</div>
      </div>
    </div>

    <div class="panel">
      <div class="hd"><span class="micro">running</span><span class="micro" id="runct">0</span></div>
      <div id="procs"><div class="empty">nothing running</div></div>
      <button class="stopall" onclick="stopAll()">STOP EVERYTHING</button>
    </div>

    <div class="panel">
      <div class="hd"><span class="micro">output log</span></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
let CAT=null, sel=null;
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function boot(){
  CAT=await (await fetch('/api/catalog')).json();
  if(CAT.dry_run) document.getElementById('dry').style.display='inline-block';
  const c=CAT.config||{};
  document.getElementById('env').innerHTML=
    [`DOMAIN ${c.domain||'42'}`,'FASTRTPS','UDP',`${c.robot_ip||''}`].filter(Boolean)
    .map(x=>`<span>${esc(x)}</span>`).join('');
  renderCatalog(); tick(); setInterval(tick,700);
}

function rowHTML(a){
  const ly=a.layer||'none';
  const tags=[`<span class="ly ${ly}">${ly==='none'?'passive':ly}</span>`];
  if(a.danger) tags.push('<span class="flag danger">sudo</span>');
  if(a.runs_on==='robot_host') tags.push('<span class="flag">robot host</span>');
  if(a.needs) tags.push(`<span class="flag">${esc(a.needs)}</span>`);
  return `<div class="row ${ly}" data-id="${a.id}" onclick="pick('${a.id}')">
    <div class="bar"></div>
    <div class="mid">
      <div class="lab"><span class="t">${esc(a.label)}</span>${tags.join('')}</div>
      <div class="cmdline">${esc(a.cmd_resolved)}</div>
    </div>
    <div class="act" title="select">▸</div>
  </div>`;
}
function renderCatalog(){
  const byCat={};
  CAT.attacks.forEach(a=>{(byCat[a.cat]=byCat[a.cat]||[]).push(a)});
  let html='';
  for(const [c,list] of Object.entries(byCat)){
    html+=`<div class="cathead"><span class="nm">${esc(c)}</span>
      <span class="ct">${list.length}</span><span class="rule"></span></div>`;
    html+=list.map(rowHTML).join('');
  }
  html+=`<div class="cathead"><span class="nm">Network Tools</span>
    <span class="ct">${CAT.tools.length}</span><span class="rule"></span></div>`;
  html+=CAT.tools.map(rowHTML).join('');
  document.getElementById('catalog').innerHTML=html;
}
function pick(id){
  sel=[...CAT.attacks,...CAT.tools].find(a=>a.id===id);
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
  const sc=document.getElementById('selcmd'), lb=document.getElementById('launch');
  sc.textContent=sel.cmd_resolved; sc.classList.remove('empty');
  lb.classList.add('armed'); lb.disabled=false; lb.textContent='LAUNCH';
  lb.onclick=()=>run(id);
}
async function run(id){
  const r=await (await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id})})).json();
  if(!r.ok) alert('Failed: '+(r.error||'?'));
}
async function stop(pid){ await fetch('/api/stop',{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({pid})}); }
async function stopAll(){ await fetch('/api/stop_all',{method:'POST'}); }

function setCell(id,on,txt){
  const el=document.getElementById('cell-'+id);
  el.classList.toggle('on',on);
  document.getElementById('v-'+id).textContent=on?txt:'quiet';
}

async function tick(){
  let s; const conn=document.getElementById('conn');
  try{ s=await (await fetch('/api/state')).json(); }
  catch(e){ conn.classList.add('stale'); document.getElementById('conntext').textContent='no server'; return; }
  conn.classList.remove('stale'); document.getElementById('conntext').textContent='linked';

  const v=s.verdict||{}, raw=(v.status||''), st=raw.toUpperCase(), tr=(v.track||'');
  const net=st.includes('[NET]'), phy=st.includes('[PHY]');
  setCell('net',net,'FIRING'); setCell('phy',phy,'FIRING');

  const vd=document.getElementById('verdict'), big=document.getElementById('vbig'),
        sub=document.getElementById('vsub');
  let cls='clear', label='CLEAR', note=tr?('track · '+tr.toLowerCase()):'nominal';
  if(st.startsWith('INTRUSION')){cls='intr'; label='INTRUSION'; note=raw.replace(/^INTRUSION:?\s*/i,'')||'detected';}
  else if(st.startsWith('CALIBRAT')){cls='cal'; label='CALIBRATING'; note=raw.toLowerCase();}
  else if(tr==='RECOVERING'){cls='rec'; label='RECOVERING'; note='returning to track';}
  else if(st==='CLEAR'){cls='clear'; label='CLEAR';}
  else if(!raw){label='—'; note='waiting for detector';}
  vd.className='verdict '+cls; big.textContent=label; sub.textContent=note.slice(0,60);

  const running=new Set(s.procs.filter(p=>p.running).map(p=>p.id));
  document.querySelectorAll('.row').forEach(el=>el.classList.toggle('live',running.has(el.dataset.id)));
  document.querySelectorAll('.row.live .act').forEach(a=>a.innerHTML='<span class="pulse"></span>');

  const pr=s.procs.filter(p=>p.running);
  document.getElementById('runct').textContent=pr.length;
  document.getElementById('procs').innerHTML = pr.length ? pr.map(p=>
    `<div class="proc"><span class="age">${p.secs}s</span>
     <span class="nm" title="${esc(p.cmd)}">${esc(p.label)}</span>
     <button onclick="stop(${p.pid})">STOP</button></div>`).join('')
    : '<div class="empty">nothing running</div>';

  const lg=document.getElementById('log'), bot=lg.scrollTop+lg.clientHeight>=lg.scrollHeight-24;
  lg.innerHTML=s.logs.map(l=>{
    let c=''; if(l.includes('START'))c='s'; else if(l.includes('FAILED')||l.includes('rc=1'))c='e';
    else if(l.includes('STOP')||l.includes('DRY-RUN'))c='w';
    const m=l.match(/^(\S+)\s+(.*)$/);
    return m?`<div class="${c}"><span class="tm">${m[1]}</span> ${esc(m[2])}</div>`:`<div>${esc(l)}</div>`;
  }).join('');
  if(bot) lg.scrollTop=lg.scrollHeight;
}
boot();
</script>
</body>
</html>
