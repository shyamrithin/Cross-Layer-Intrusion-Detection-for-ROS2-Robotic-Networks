<!DOCTYPE html>
<!--
================================================================================
 File        : index.html
 Project     : Cross-Layer Intrusion Detection for ROS 2 Robotic Networks
 Author      : Shyam Rithin S
 Description : Single-page dashboard for ids_console.py. Groups the attack
               catalogue by category, shows the exact command line for each
               entry, launches/stops them by id, lists running processes, and
               displays the live detector verdict and an output log. Polls
               /api/state; no build step, no external libraries.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IDS Attack Console</title>
<style>
  :root{
    --bg:#0e1420; --panel:#162032; --panel2:#1d2a3e; --line:#2a3a52;
    --ink:#e4ebf5; --mut:#93a6bd; --dim:#64788f;
    --red:#f0564a; --grn:#33d69a; --amb:#f2b03c; --cyan:#38c0e8; --vio:#a78bfa;
    --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .spacer{flex:1}
  .pill{font-family:var(--mono);font-size:13px;font-weight:600;padding:6px 14px;
        border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--grn)}
  .pill.alert{color:var(--red);border-color:#5a2721;background:#2a1614}
  .pill.alert .dot{background:var(--red)}
  .pill.warn{color:var(--amb);border-color:#6a4a17;background:#241c10}
  .pill.warn .dot{background:var(--amb)}
  .dry{color:var(--amb);font-family:var(--mono);font-size:12px;border:1px solid #6a4a17;
       padding:4px 10px;border-radius:6px}
  .wrap{display:grid;grid-template-columns:1fr 360px;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
  .cat{margin-bottom:14px}
  .cat h3{font-size:13px;margin:0 0 7px;color:var(--cyan)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
  .atk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
       cursor:pointer;transition:.1s;position:relative}
  .atk:hover{border-color:#3d5872;background:#22314880}
  .atk .t{font-size:13px;font-weight:500;margin-bottom:3px}
  .atk .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
  .tag{font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;padding:1px 6px;border-radius:4px;
       border:1px solid var(--line);color:var(--mut)}
  .tag.physics{color:var(--amb);border-color:#6a4a17}
  .tag.network{color:var(--cyan);border-color:#1d5b74}
  .tag.none{color:var(--dim)}
  .tag.danger{color:var(--red);border-color:#5a2721}
  .tag.host{color:var(--vio);border-color:#4a3c7a}
  .atk code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mut);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .atk.on{border-color:var(--red);background:#2a161480}
  .atk .run{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
            background:var(--red);display:none}
  .atk.on .run{display:block}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
         border-radius:7px;padding:7px 12px;cursor:pointer}
  button:hover{background:var(--panel)}
  button.stopall{background:#2a1614;border-color:#5a2721;color:#f4b6ae;width:100%;margin-top:4px}
  .verdict{font-family:var(--mono);font-size:20px;font-weight:600;text-align:center;padding:14px;
           border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
  .verdict.clear{color:var(--grn)} .verdict.intr{color:var(--red);background:#2a1614;border-color:#5a2721}
  .verdict.rec{color:var(--amb)} .verdict .sm{font-size:12px;color:var(--mut);margin-top:6px;font-weight:400}
  .proc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:var(--panel2);
        border:1px solid var(--line);margin-bottom:6px;font-size:12px}
  .proc code{font-family:var(--mono);font-size:11px;color:var(--mut);flex:1;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .proc button{padding:3px 9px;font-size:11px;background:#2a1614;border-color:#5a2721;color:#f4b6ae}
  .proc .age{font-family:var(--mono);color:var(--dim);font-size:11px}
  .log{height:260px;overflow-y:auto;font-family:var(--mono);font-size:11px;line-height:1.55;
       background:#0b1018;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  .log .warnl{color:var(--amb)} .log .startl{color:var(--grn)} .log .errl{color:var(--red)}
  .sel{margin:4px 0 12px;padding:10px;border:1px dashed var(--line);border-radius:8px;background:#0b1018}
  .sel .lbl{font-size:13px;font-weight:600;margin-bottom:5px}
  .sel code{display:block;font-family:var(--mono);font-size:12px;color:var(--cyan);white-space:pre-wrap;
            word-break:break-all;margin-bottom:6px}
  .sel .d{font-size:12px;color:var(--mut);margin-bottom:8px}
  .sel .go{background:#123a2c;border-color:#1e6c4f;color:#b7f2d8}
  .foot{color:var(--dim);font-size:11px;text-align:center;padding:8px;font-family:var(--mono)}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Cross-Layer IDS &mdash; Attack Console</h1>
  <span class="sub">ROS 2 / DDS &middot; lab testbed</span>
  <span id="dry" class="dry" style="display:none">DRY-RUN</span>
  <div class="spacer"></div>
  <div id="pill" class="pill"><span class="dot"></span><span id="pilltext">detector: --</span></div>
</header>

<div class="wrap">
  <div class="col">
    <div class="card">
      <div id="selected" class="sel" style="display:none">
        <div class="lbl" id="sel-lbl"></div>
        <code id="sel-cmd"></code>
        <div class="d" id="sel-desc"></div>
        <button class="go" id="sel-go">Launch this</button>
      </div>
      <div id="cats"></div>
    </div>
    <div class="card">
      <h2>Network tools</h2>
      <div class="grid" id="tools"></div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2>Detector verdict</h2>
      <div id="verdict" class="verdict clear">--<div class="sm" id="vsub">waiting for /physguard/status</div></div>
    </div>
    <div class="card">
      <h2>Running</h2>
      <div id="procs"><div style="color:var(--dim);font-size:12px">nothing running</div></div>
      <button class="stopall" onclick="stopAll()">Stop everything</button>
    </div>
    <div class="card">
      <h2>Output log</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<div class="foot">ID-based launcher &middot; commands run only against your own robot on an isolated ROS_DOMAIN_ID &middot; lab use only</div>

<script>
let CAT=null, sel=null;
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function boot(){
  CAT=await (await fetch('/api/catalog')).json();
  if(CAT.dry_run) document.getElementById('dry').style.display='inline-block';
  renderCats(); renderTools(); tick(); setInterval(tick,700);
}
function card(a){
  const tags=[]; if(a.layer) tags.push(`<span class="tag ${a.layer}">${a.layer==='none'?'not detected':a.layer}</span>`);
  if(a.danger) tags.push('<span class="tag danger">sudo/danger</span>');
  if(a.runs_on==='robot_host') tags.push('<span class="tag host">robot host</span>');
  if(a.needs) tags.push(`<span class="tag">needs ${a.needs}</span>`);
  return `<div class="atk" data-id="${a.id}" onclick="pick('${a.id}')">
    <span class="run"></span>
    <div class="t">${esc(a.label)}</div>
    <div class="meta">${tags.join('')}</div>
    <code>${esc(a.cmd_resolved)}</code></div>`;
}
function renderCats(){
  const byCat={};
  CAT.attacks.forEach(a=>{(byCat[a.cat]=byCat[a.cat]||[]).push(a)});
  document.getElementById('cats').innerHTML=Object.entries(byCat).map(([c,list])=>
    `<div class="cat"><h3>${esc(c)} <span style="color:var(--dim);font-weight:400">(${list.length})</span></h3>
     <div class="grid">${list.map(card).join('')}</div></div>`).join('');
}
function renderTools(){
  document.getElementById('tools').innerHTML=CAT.tools.map(card).join('');
}
function pick(id){
  sel=[...CAT.attacks,...CAT.tools].find(a=>a.id===id);
  document.getElementById('selected').style.display='block';
  document.getElementById('sel-lbl').textContent=sel.label;
  document.getElementById('sel-cmd').textContent=sel.cmd_resolved;
  document.getElementById('sel-desc').textContent=sel.desc||'';
  document.getElementById('sel-go').onclick=()=>run(id);
  window.scrollTo({top:0,behavior:'smooth'});
}
async function run(id){
  const r=await (await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id})})).json();
  if(!r.ok) alert('Failed: '+(r.error||'?'));
}
async function stop(pid){ await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({pid})}); }
async function stopAll(){ await fetch('/api/stop_all',{method:'POST'}); }

async function tick(){
  let s; try{ s=await (await fetch('/api/state')).json(); }catch(e){ return; }
  // verdict
  const v=s.verdict||{}, st=(v.status||'').toUpperCase(), tr=(v.track||'');
  const vd=document.getElementById('verdict'), pill=document.getElementById('pill'),
        pt=document.getElementById('pilltext');
  let cls='clear', txt=v.status||'--', sub=tr?('track: '+tr):'';
  if(st.startsWith('INTRUSION')){cls='intr';} else if(st.startsWith('CALIBRAT')){cls='rec';}
  else if(tr==='RECOVERING'){cls='rec';} else if(st==='CLEAR'){cls='clear';}
  vd.className='verdict '+cls; vd.innerHTML=esc(txt)+`<div class="sm">${esc(sub||'')}</div>`;
  pill.className='pill '+(cls==='intr'?'alert':cls==='rec'?'warn':'');
  pt.textContent='detector: '+(txt||'--');
  // running set -> highlight cards
  const running=new Set(s.procs.filter(p=>p.running).map(p=>p.id));
  document.querySelectorAll('.atk').forEach(el=>el.classList.toggle('on',running.has(el.dataset.id)));
  // procs
  const pr=s.procs.filter(p=>p.running);
  document.getElementById('procs').innerHTML = pr.length? pr.map(p=>
    `<div class="proc"><span class="age">${p.secs}s</span><code title="${esc(p.cmd)}">${esc(p.label)}</code>
     <button onclick="stop(${p.pid})">stop</button></div>`).join('')
    : '<div style="color:var(--dim);font-size:12px">nothing running</div>';
  // log
  const lg=document.getElementById('log'), atBottom=lg.scrollTop+lg.clientHeight>=lg.scrollHeight-20;
  lg.innerHTML=s.logs.map(l=>{
    let c=''; if(l.includes('START'))c='startl'; else if(l.includes('FAILED')||l.includes('exited rc=1'))c='errl';
    else if(l.includes('STOP')||l.includes('DRY-RUN'))c='warnl';
    return `<div class="${c}">${esc(l)}</div>`;}).join('');
  if(atBottom) lg.scrollTop=lg.scrollHeight;
}
boot();
</script>
</body>
</html>
